name: jaxiv

services:
  pdf-analysis:
    container_name: pdf-analysis
    build:
      context: ./pdf_analysis
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    ports:
      - "7860:7860"
    environment:
      LLAMA_INDEX_CACHE_DIR: /app/.cache/llama_index
      # Dockerfile の HF_HOME と同じ。モデルはイメージに含めず、初回利用時にホスト pdf_analysis/.cache/hf へキャッシュ
      HF_HOME: /app/.cache/hf
    volumes:
      - pdf-analysis-venv:/app/.venv
      - ./pdf_analysis/.cache:/app/.cache
    command: >
      sh -c "uv sync &&
             uv run uvicorn main:app --host 0.0.0.0 --port 7860 --reload"
    networks:
      - jaxiv
    develop:
      watch:
        - action: sync
          path: ./pdf_analysis
          target: /app
          ignore:
            - .venv/
            - .cache/
            - __pycache__/
            - .git/
            - .pytest_cache/
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: ./pdf_analysis/pyproject.toml
        - action: rebuild
          path: ./pdf_analysis/uv.lock

  tex-translation:
    container_name: tex-translation
    build:
      context: ./tex_translation
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    ports:
      - "8100:8100"
    env_file:
      - ./tex_translation/.env
    volumes:
      - tex-translation-venv:/app/.venv
    command: >
      sh -c "uv sync &&
             uv run uvicorn main:app --host 0.0.0.0 --port 8100 --reload"
    networks:
      - jaxiv
    develop:
      watch:
        - action: sync
          path: ./tex_translation
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - .git/
            - .pytest_cache/
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: ./tex_translation/pyproject.toml
        - action: rebuild
          path: ./tex_translation/uv.lock

  api:
    container_name: jaxiv-api
    build:
      context: ./backend
      dockerfile: Dockerfile.render
    restart: unless-stopped
    working_dir: /app
    depends_on:
      minio-init:
        condition: service_completed_successfully
      pdf-analysis:
        condition: service_started
      tex-translation:
        condition: service_started
    ports:
      - "8001:8000"
    # Linux で host.docker.internal を解決するために host-gateway を明示
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Supabase ローカル環境（DB / Auth、ホスト側で `supabase start` したもの）へ接続
      POSTGRES_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      JWKS_URL: http://host.docker.internal:54321/auth/v1/.well-known/jwks.json
      # ローカル開発では S3 互換の MinIO を使用する。本番環境は Render 側で Cloudflare R2 を設定する。
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      TRANSLATED_ARXIV_BUCKET_NAME: translated-arxiv-bucket
      BLOG_FIGURES_BUCKET_NAME: blog-figures
      # API が返す URL はブラウザからアクセスするため、Docker 内部名ではなくホスト側 URL を使う。
      TRANSLATED_ARXIV_PUBLIC_BASE_URL: http://localhost:9000/translated-arxiv-bucket
      BLOG_FIGURES_PUBLIC_BASE_URL: http://localhost:9000/blog-figures
      LAYOUT_ANALYSIS_URL: http://pdf-analysis:7860
      TEX_TRANSLATION_URL: http://tex-translation:8100
      OUTPUT_DIR: /app/output
      QDRANT_URL: http://qdrant:6333
      # API キー等、上で固定していない値は env_file(./backend/.env) から注入する。
    volumes:
      - api-venv:/app/.venv
      - ./backend/output:/app/output
    env_file:
      - ./backend/.env
    command: >
      sh -c "uv sync &&
             uv run alembic upgrade head &&
             uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    networks:
      - jaxiv
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - .venv/
            - __pycache__/
            - .git/
            - .pytest_cache/
            - output/
            - pyproject.toml
            - uv.lock
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock

  minio:
    container_name: jaxiv-minio
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - jaxiv

  minio-init:
    container_name: jaxiv-minio-init
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    entrypoint: /bin/sh
    command:
      - -c
      - |
        until /usr/bin/mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        /usr/bin/mc mb --ignore-existing local/translated-arxiv-bucket
        /usr/bin/mc mb --ignore-existing local/blog-figures
        /usr/bin/mc anonymous set download local/translated-arxiv-bucket
        /usr/bin/mc anonymous set download local/blog-figures
    networks:
      - jaxiv

  qdrant:
    container_name: jaxiv-qdrant
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - jaxiv

volumes:
  api-venv:
  pdf-analysis-venv:
  tex-translation-venv:
  minio-data:
  qdrant-data:

networks:
  jaxiv:
    name: jaxiv_local_net
