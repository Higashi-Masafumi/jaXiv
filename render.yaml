services:
  - name: jaxiv-tex-translation
    type: web
    plan: free
    runtime: docker
    repo: https://github.com/Higashi-Masafumi/jaXiv
    dockerfilePath: Dockerfile
    rootDir: ./tex_translation
    envVars:
      # MISTRAL_API_KEY は Render ダッシュボードでシークレットとして設定する
      - key: MISTRAL_API_KEY
        sync: false

  - name: arxiv-translation-service
    type: web
    plan: free
    runtime: python
    repo: https://github.com/Higashi-Masafumi/jaXiv
    rootDir: ./backend
    buildCommand: pip install uv && uv sync
    startCommand: uv run uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: NIXPACKS_APT_PKGS
        value: poppler-utils
      - key: LAYOUT_ANALYSIS_URL
        value: https://masamasa4-jaxiv-pdf-analysis.hf.space
      - key: TEX_TRANSLATION_URL
        # Render private service: 同アカウント内から http://<service-name>:<port> で解決できる
        value: https://jaxiv-tex-translation.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://jaxiv-frontend.cruiseeast.workers.dev/
      # オブジェクトストレージ (S3 互換 / Cloudflare R2)
      # 機密値・アカウント固有値は Render ダッシュボードでシークレットとして設定する
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: TRANSLATED_ARXIV_PUBLIC_BASE_URL
        sync: false
      - key: BLOG_FIGURES_PUBLIC_BASE_URL
        sync: false
