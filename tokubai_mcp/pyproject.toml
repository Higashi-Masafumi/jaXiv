[project]
name = "tokubai-mcp"
version = "0.1.0"
description = "近くのスーパーの特売・ポイントデー情報を提供する MCP サーバー"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.0.0",
    "ruff>=0.14.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["mcp", "mcp.*"]
ignore_missing_imports = true
